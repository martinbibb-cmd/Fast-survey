<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fast Survey – Tree</title>
  <link rel="stylesheet" href="./assets/app.css">
  <style>
    /* Lightweight layout additions for sidebar + selection styling */
    .layout { display: grid; grid-template-columns: 1fr 340px; gap: 14px; padding: 14px; }
    .panel { background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
    .panel h3 { margin: 0 0 8px 0; font-size: 16px; }
    .panel .muted { color: var(--muted); font-size: 13px; }
    .summary { display: grid; gap: 8px; }
    .summary .card { border:1px solid var(--line); border-radius:10px; padding:8px; }
    .summary .title { font-weight: 600; margin-bottom: 4px; }
    textarea.notes { width: 100%; min-height: 120px; border-radius: 10px; background: #0d0f15; border:1px solid var(--line); color: var(--text); padding: 8px; }
    .btn { background: var(--panel); border:1px solid var(--line); color: var(--text); padding:8px 12px; border-radius:10px; cursor:pointer }
    .btn:hover { border-color: var(--accent); }
    .node.selected { outline: 2px solid var(--accent); box-shadow: 0 0 0 2px rgba(124,217,146,.15) inset; }
    .stack { display: grid; gap: 8px; }
    .micro { font-size: 12px; color: var(--muted); }
    .pill { display:inline-block; padding:2px 8px; border:1px solid var(--line); border-radius:999px; font-size:12px; color: var(--muted); }
    .sep { height:1px; background: var(--line); margin:8px 0; }
    .scroll-hint { font-size: 12px; color: var(--muted); }
    .section-title { display:flex; align-items:center; gap:8px; margin: 6px 0 10px 0; }
  </style>
</head>
<body>
  <header class="page-header">
    <nav><a href="./index2.html" class="back">← All Trees</a></nav>
    <h1 id="tree-title">Loading…</h1>
    <div class="controls">
      <button id="expand-all" class="btn">Expand all</button>
      <button id="collapse-all" class="btn">Collapse all</button>
      <button id="reset-growth" class="btn">Reload & Grow 🌱</button>
    </div>
  </header>

  <main class="layout">
    <!-- Left: tree content -->
    <section id="tree-root" class="tree-container" aria-live="polite"></section>

    <!-- Right: live notes -->
    <aside class="panel">
      <h3>Selections & Notes</h3>
      <div class="summary">
        <div class="card">
          <div class="title">A (Current)</div>
          <div id="selA" class="stack micro">
            <span class="muted">Nothing selected yet.</span>
          </div>
        </div>
        <div class="card">
          <div class="title">B (Proposed)</div>
          <div id="selB" class="stack micro">
            <span class="muted">Select from B after choosing A.</span>
          </div>
        </div>
      </div>

      <div class="sep"></div>
      <div class="section-title"><span class="pill">Depot text</span><span class="scroll-hint" id="flowHint"></span></div>
      <textarea id="notesBox" class="notes" spellcheck="false"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button id="copyNotes" class="btn">Copy</button>
        <button id="clearSel" class="btn">Clear selections</button>
      </div>
    </aside>
  </main>

  <div id="done-overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2>All branches grown 🌳</h2>
      <p>Tap “Done” to collapse back to the roots.</p>
      <button id="overlay-done" class="btn">Done</button>
    </div>
  </div>

  <script src="./assets/trees.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
