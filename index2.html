<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fast Survey – Trees (index2)</title>
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <header class="site-header">
    <h1>Fast Survey – Tree Grove</h1>
    <p class="subtitle">Pick a tree to explore. Each opens as its own page.</p>
  </header>

  <main class="card-grid">
    <a class="card" href="./page.html?tree=boiler-a-b">
      <h2>Boiler A → B</h2>
      <p>Current boiler → New boiler choices</p>
    </a>
    <a class="card" href="./page.html?tree=flue-a-b">
      <h2>Flue A → B</h2>
      <p>Current flue → New flue options</p>
    </a>
    <a class="card" href="./page.html?tree=cylinder-a-b">
      <h2>Cylinder A → B</h2>
      <p>Current cylinder → New cylinder choices</p>
    </a>

    <!-- Add other trees by adding more links like below -->
    <a class="card" href="./page.html?tree=example-other">
      <h2>Example – Other Tree</h2>
      <p>Placeholder tree for testing</p>
    </a>
  </main>

  <footer class="site-footer">
    <button id="reload-grow">Reload & Grow 🌳</button>
  </footer>

  <script>
    document.getElementById('reload-grow').addEventListener('click', () => {
      // Soft visual: reload the page to see the growth animation on open.
      location.reload();
    });
  </script>
</body>
</html>
