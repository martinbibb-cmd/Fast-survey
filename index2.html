<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fast Survey – Trees</title>
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <header class="site-header">
    <h1>Fast Survey – Tree Grove</h1>
    <p class="subtitle">Pick a survey tree to explore its branches.</p>
  </header>

  <main class="card-grid" id="treeGrid" aria-live="polite">
    <p class="subtitle" id="treeLoading">Loading tree index…</p>
  </main>

  <footer class="site-footer">
    <button id="reload-grow">Reload &amp; Grow 🌳</button>
  </footer>

  <script src="./assets/trees.js"></script>
  <script>
    const grid = document.getElementById('treeGrid');
    const loading = document.getElementById('treeLoading');

    if (typeof TREE_ORDER === 'undefined' || typeof TREE_INDEX === 'undefined') {
      loading.textContent = 'Tree index failed to load.';
    } else {
      grid.innerHTML = '';
      TREE_ORDER.forEach((key) => {
        const meta = TREE_INDEX[key];
        if (!meta) return;
        const card = document.createElement('a');
        card.className = 'card';
        card.href = `./page.html?tree=${encodeURIComponent(key)}`;
        const title = document.createElement('h2');
        title.textContent = meta.title;
        const summary = document.createElement('p');
        summary.textContent = meta.summary || '';
        card.appendChild(title);
        card.appendChild(summary);
        grid.appendChild(card);
      });
      if (!grid.children.length) {
        const empty = document.createElement('p');
        empty.className = 'subtitle';
        empty.textContent = 'No trees registered yet.';
        grid.appendChild(empty);
      }
    }

    document.getElementById('reload-grow').addEventListener('click', () => {
      location.reload();
    });
  </script>
</body>
</html>
